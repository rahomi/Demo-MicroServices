server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS resolver — prevents nginx crash when backend containers restart
    resolver 127.0.0.11 valid=10s;

    # Variable-based upstreams for dynamic DNS resolution
    set $bff_host bff;
    set $notifications_host notifications;

    # Notifications service (more specific — takes precedence)
    location /api/notifications/ {
        proxy_pass http://$notifications_host:5004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All other API calls → BFF
    location /api/ {
        proxy_pass http://$bff_host:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
